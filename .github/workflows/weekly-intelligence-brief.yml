name: Weekly AI Intelligence Brief

on:
  schedule:
    # Run weekly on Sunday at 9:00 AM Pakistan Time (PKT = UTC+5)
    # 9:00 AM PKT = 4:00 AM UTC
    - cron: '0 4 * * 0'

  # Allow manual trigger for testing
  workflow_dispatch:

# Concurrency protection
concurrency:
  group: intelligence-brief-workflow
  cancel-in-progress: false

jobs:
  run-intelligence-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restore database from previous run
      - name: Restore database cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: database/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL=${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER=smtp.gmail.com
          SMTP_PORT=587
          DATABASE_PATH=database/news.db
          LOG_LEVEL=INFO
          LOG_FILE=logs/agent.log
          TIMEZONE=Asia/Karachi
          EOF

      - name: Create necessary directories
        run: |
          mkdir -p database
          mkdir -p logs

      - name: Run database migration (if needed)
        run: |
          python database/migrate_v1.py || echo "Migration may have already run"

      - name: Run V1 Intelligence Worker
        id: run-intelligence
        run: python main_v1.py
        env:
          TZ: Asia/Karachi

      # Save database to cache for next run
      - name: Save database cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: database/news.db
          key: news-db-${{ github.run_id }}

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-logs
          path: logs/agent.log
          retention-days: 7
