name: Daily AI News Agent

on:
  schedule:
    # Run daily at 8:50 AM Pakistan Time (PKT = UTC+5)
    # 8:50 AM PKT = 3:50 AM UTC
    - cron: '50 3 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

# Concurrency protection - ensures only one workflow run executes at a time
# Prevents simultaneous runs from causing duplicate posts or database conflicts
concurrency:
  group: news-agent-workflow
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restore database from previous run to maintain article history
      # Uses pattern matching to find most recent cache entry
      - name: Restore database cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: database/news.db
          key: news-db-${{ github.run_id }}
          restore-keys: |
            news-db-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL=${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER=smtp.gmail.com
          SMTP_PORT=587
          DATABASE_PATH=database/news.db
          LOG_LEVEL=INFO
          LOG_FILE=logs/agent.log
          TIMEZONE=Asia/Karachi
          EOF

      - name: Create necessary directories
        run: |
          mkdir -p database
          mkdir -p logs

      - name: Run AI News Agent
        id: run-agent
        run: python main.py
        env:
          TZ: Asia/Karachi

      # Save database to cache for next run (only on successful execution)
      # Condition: success() ensures we only cache known-good database state
      # This prevents corrupted or partial databases from overwriting good cache
      - name: Save database cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: database/news.db
          key: news-db-${{ github.run_id }}

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-logs
          path: logs/agent.log
          retention-days: 7
